name: keep-alive
# Loads the live app in a real browser every 6 hours so Streamlit Cloud does not put it to sleep.
# If the app is already asleep, it clicks "Yes, get this app back up!".
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  visit:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Visit the app
        run: |
          cat > visit.py <<'PY'
          from playwright.sync_api import sync_playwright
          URL = "https://strentor-assistant.streamlit.app/"
          with sync_playwright() as p:
              b = p.chromium.launch()
              page = b.new_page()
              page.goto(URL, timeout=90000)
              try:
                  page.get_by_role("button", name="Yes, get this app back up!").click(timeout=15000)
                  print("App was asleep; wake-up clicked.")
              except Exception:
                  print("App was already awake.")
              page.wait_for_timeout(45000)
              print("Title:", page.title())
              b.close()
          PY
          python visit.py
